<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your BreakFit cart — review items, apply discount codes, and proceed to secure checkout.">
  <title>Cart — BreakFit Premium Dry Fruits</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 52 52'%3E%3Crect width='52' height='52' rx='12' fill='%231A5C33'/%3E%3Ctext x='7' y='36' font-family='Georgia,serif' font-size='28' font-weight='700' fill='%23D4A853'%3E3%3C/text%3E%3Ctext x='26' y='36' font-family='Georgia,serif' font-size='24' font-weight='700' fill='%23fff'%3EF%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="css/design-tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components/header.css">
  <link rel="stylesheet" href="css/components/footer.css">
  <link rel="stylesheet" href="css/components/toast.css">
  <link rel="stylesheet" href="css/components/whatsapp.css">
  <link rel="stylesheet" href="css/components/cart-drawer.css">
  <link rel="stylesheet" href="css/pages/cart.css">
</head>
<body>
  <div id="site-header"></div>
  <div id="toast-container"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="index.html">Home</a>
          <span class="sep"><i class="ri-arrow-right-s-line"></i></span>
          <span class="current">Shopping Cart</span>
        </nav>
        <h1>Your Cart</h1>
      </div>
    </section>

    <div class="container cart-layout" id="cart-layout">
      <!-- Cart Items -->
      <div class="cart-items-col">
        <div id="cart-items"></div>
      </div>

      <!-- Order Summary -->
      <aside class="cart-summary-col">
        <div class="order-summary" id="order-summary">
          <h2>Order Summary</h2>

          <div class="promo-row">
            <input type="text" id="promo-input" class="form-control" placeholder="Promo code (try BREAK10)">
            <button class="btn btn--secondary" id="apply-promo-btn">Apply</button>
          </div>
          <p class="promo-msg" id="promo-msg"></p>

          <div class="summary-lines">
            <div class="summary-line"><span>Subtotal</span><span id="summary-subtotal">₹0</span></div>
            <div class="summary-line"><span>Shipping</span><span id="summary-shipping">₹0</span></div>
            <div class="summary-line discount-line" id="discount-line" style="display:none">
              <span>Discount (BREAK10)</span><span id="summary-discount" style="color:var(--color-accent)">−₹0</span>
            </div>
            <div class="summary-line summary-total"><span>Total</span><span id="summary-total">₹0</span></div>
          </div>

          <a href="checkout.html" class="btn btn--primary btn-lg checkout-btn" id="checkout-btn" style="width:100%;justify-content:center">
            <i class="ri-shield-check-line"></i> Proceed to Checkout
          </a>
          <a href="categories.html" class="btn btn-ghost" style="width:100%;justify-content:center;margin-top:var(--space-3)">
            <i class="ri-arrow-left-line"></i> Continue Shopping
          </a>
          <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;font-size:12px;color:var(--color-text-muted)">
            <i class="ri-shield-check-line" style="color:#1A5C33"></i> Secure Checkout &nbsp;|&nbsp;
            <i class="ri-whatsapp-line" style="color:#25D366"></i> Order via WhatsApp
          </div>
          <div class="cart-payment-logos">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Visa_Inc._logo.svg/200px-Visa_Inc._logo.svg.png" alt="Visa" title="Visa">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Mastercard-logo.svg/200px-Mastercard-logo.svg.png" alt="Mastercard" title="Mastercard">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/Google_Pay_Logo.svg/200px-Google_Pay_Logo.svg.png" alt="Google Pay" title="Google Pay">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/71/PhonePe_Logo.svg/200px-PhonePe_Logo.svg.png" alt="PhonePe" title="PhonePe">
            <span class="cart-pay-icon-pill">COD</span>
            <span class="cart-pay-icon-pill">UPI</span>
          </div>
        </div>
      </aside>
    </div>

    <!-- Empty cart state -->
    <div class="empty-state" id="empty-cart" style="display:none">
      <div class="empty-state-icon"><i class="ri-shopping-cart-line"></i></div>
      <h3>Your cart is empty</h3>
      <p>Looks like you haven't added anything yet. Browse our premium collection!</p>
      <a href="categories.html" class="btn btn--primary">Shop Now</a>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/data/products.js"></script>
  <script src="js/data/categories.js"></script>
  <script src="js/utils/sanitize.js"></script>
  <script src="js/utils/renderStars.js"></script>
  <script src="js/utils/scrollAnimations.js"></script>
  <script src="js/modules/CartStore.js"></script>
  <script src="js/modules/ToastNotification.js"></script>
  <script src="js/modules/WhatsAppWidget.js"></script>
  <script src="js/modules/Header.js"></script>
  <script src="js/modules/Footer.js"></script>
  <script src="js/modules/QuantitySelector.js"></script>
  <script src="js/pages/cart.js"></script>
</body>
</html>
