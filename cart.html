<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — BreakFit Premium Dry Fruits</title>

  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="css/design-tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components/header.css">
  <link rel="stylesheet" href="css/components/footer.css">
  <link rel="stylesheet" href="css/components/toast.css">
  <link rel="stylesheet" href="css/components/whatsapp.css">
  <link rel="stylesheet" href="css/pages/cart.css">
</head>
<body>
  <div id="site-header"></div>
  <div id="toast-container"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="index.html">Home</a>
          <span class="sep"><i class="ri-arrow-right-s-line"></i></span>
          <span class="current">Shopping Cart</span>
        </nav>
        <h1>Your Cart</h1>
      </div>
    </section>

    <div class="container cart-layout" id="cart-layout">
      <!-- Cart Items -->
      <div class="cart-items-col">
        <div id="cart-items"></div>
      </div>

      <!-- Order Summary -->
      <aside class="cart-summary-col">
        <div class="order-summary" id="order-summary">
          <h2>Order Summary</h2>

          <div class="promo-row">
            <input type="text" id="promo-input" class="form-control" placeholder="Promo code (try BREAK10)">
            <button class="btn btn--secondary" id="apply-promo-btn">Apply</button>
          </div>
          <p class="promo-msg" id="promo-msg"></p>

          <div class="summary-lines">
            <div class="summary-line"><span>Subtotal</span><span id="summary-subtotal">₹0</span></div>
            <div class="summary-line"><span>Shipping</span><span id="summary-shipping">₹0</span></div>
            <div class="summary-line discount-line" id="discount-line" style="display:none">
              <span>Discount (BREAK10)</span><span id="summary-discount" style="color:var(--color-accent)">−₹0</span>
            </div>
            <div class="summary-line summary-total"><span>Total</span><span id="summary-total">₹0</span></div>
          </div>

          <a href="checkout.html" class="btn btn--primary btn-lg checkout-btn" id="checkout-btn" style="width:100%;justify-content:center">
            Proceed to Checkout <i class="ri-arrow-right-line"></i>
          </a>
          <a href="categories.html" class="btn btn-ghost" style="width:100%;justify-content:center;margin-top:var(--space-3)">Continue Shopping</a>
        </div>
      </aside>
    </div>

    <!-- Empty cart state -->
    <div class="empty-state" id="empty-cart" style="display:none">
      <div class="empty-state-icon"><i class="ri-shopping-cart-line"></i></div>
      <h3>Your cart is empty</h3>
      <p>Looks like you haven't added anything yet. Browse our premium collection!</p>
      <a href="categories.html" class="btn btn--primary">Shop Now</a>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/data/products.js"></script>
  <script src="js/data/categories.js"></script>
  <script src="js/utils/sanitize.js"></script>
  <script src="js/utils/renderStars.js"></script>
  <script src="js/utils/scrollAnimations.js"></script>
  <script src="js/modules/CartStore.js"></script>
  <script src="js/modules/ToastNotification.js"></script>
  <script src="js/modules/WhatsAppWidget.js"></script>
  <script src="js/modules/Header.js"></script>
  <script src="js/modules/Footer.js"></script>
  <script src="js/modules/QuantitySelector.js"></script>
  <script src="js/pages/cart.js"></script>
</body>
</html>
