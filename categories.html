<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BreakFit — Shop all premium dry fruits and nuts. Filter by category, price, and rating. Free delivery over ₹999.">
  <title>Shop All Products — BreakFit Premium Dry Fruits</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 52 52'%3E%3Crect width='52' height='52' rx='12' fill='%231A5C33'/%3E%3Ctext x='7' y='36' font-family='Georgia,serif' font-size='28' font-weight='700' fill='%23D4A853'%3E3%3C/text%3E%3Ctext x='26' y='36' font-family='Georgia,serif' font-size='24' font-weight='700' fill='%23fff'%3EF%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com">

  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" crossorigin="anonymous">

  <link rel="stylesheet" href="css/design-tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components/header.css">
  <link rel="stylesheet" href="css/components/footer.css">
  <link rel="stylesheet" href="css/components/product-card.css">
  <link rel="stylesheet" href="css/components/toast.css">
  <link rel="stylesheet" href="css/components/whatsapp.css">
  <link rel="stylesheet" href="css/components/cart-drawer.css">
  <link rel="stylesheet" href="css/pages/categories.css">
</head>
<body>
  <div id="site-header"></div>
  <div id="toast-container"></div>

  <main>
    <!-- Page Hero -->
    <section class="page-hero">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="index.html">Home</a>
          <span class="sep"><i class="ri-arrow-right-s-line"></i></span>
          <span class="current">Shop</span>
        </nav>
        <h1>Premium Dry Fruits &amp; Nuts</h1>
        <p>Handpicked from the world's finest farms — fresh, natural, and delivered to your door.</p>
      </div>
    </section>

    <!-- Category Pills -->
    <div class="cat-pills-bar">
      <div class="container">
        <div class="cat-pills" id="cat-pills"></div>
      </div>
    </div>

    <div class="container shop-layout">
      <!-- Filter Sidebar -->
      <aside class="filter-sidebar" id="filter-sidebar">
        <div class="filter-sidebar__header">
          <h3>Filters</h3>
          <button class="btn-ghost btn-sm" id="clear-filters-btn">Clear All</button>
        </div>

        <div class="filter-group">
          <h4>Category</h4>
          <div id="filter-categories"></div>
        </div>

        <div class="filter-group">
          <h4>Price Range</h4>
          <div class="price-range-inputs">
            <input type="number" id="filter-min-price" placeholder="Min ₹" min="0">
            <span>—</span>
            <input type="number" id="filter-max-price" placeholder="Max ₹" min="0">
          </div>
        </div>

        <div class="filter-group">
          <h4>Minimum Rating</h4>
          <div class="rating-filters" id="filter-ratings"></div>
        </div>

        <div class="filter-group">
          <label class="toggle-label">
            <input type="checkbox" id="filter-in-stock">
            <span>In Stock Only</span>
          </label>
        </div>
      </aside>

      <!-- Products Area -->
      <div class="products-area">
        <div class="products-toolbar">
          <p class="results-count" id="results-count">Loading...</p>
          <div class="toolbar-right">
            <select id="sort-select" aria-label="Sort products">
              <option value="">Featured</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="rating">Top Rated</option>
              <option value="newest">Newest</option>
            </select>
            <button class="btn-ghost btn-sm filter-toggle-btn" id="filter-toggle-btn" aria-label="Toggle filters">
              <i class="ri-equalizer-line"></i> Filters
            </button>
          </div>
        </div>

        <div class="grid-4" id="products-grid"></div>

        <div class="empty-state" id="no-results" style="display:none">
          <div class="empty-state-icon"><i class="ri-search-line"></i></div>
          <h3>No products found</h3>
          <p>Try adjusting your filters or browse all categories.</p>
          <button class="btn btn--primary" id="no-results-reset">Clear Filters</button>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/data/products.js"></script>
  <script src="js/data/categories.js"></script>
  <script src="js/data/reviews.js"></script>
  <script src="js/utils/sanitize.js"></script>
  <script src="js/utils/renderStars.js"></script>
  <script src="js/utils/filterProducts.js"></script>
  <script src="js/utils/scrollAnimations.js"></script>
  <script src="js/modules/CartStore.js"></script>
  <script src="js/modules/ToastNotification.js"></script>
  <script src="js/modules/WhatsAppWidget.js"></script>
  <script src="js/modules/Header.js"></script>
  <script src="js/modules/Footer.js"></script>
  <script src="js/modules/ProductCard.js"></script>
  <script src="js/pages/categories.js"></script>
</body>
</html>
